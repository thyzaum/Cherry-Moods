<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cherry Moods · Encontre seu par de corrida</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#F7F0EA;--ink:#241015;--cherry:#C8102E;--soft:#F3C2CA;--card:#fff;--line:#EAD3D6;--leaf:#1f7a3a;--muted:#6E4B52;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2B0B14;--ink:#F7F0EA;--cherry:#E0364F;--soft:#4a1426;--card:#3D1220;--line:#5C1A2A;--leaf:#5fd07f;--muted:#D9A3AD}}
:root[data-theme="dark"]{--bg:#2B0B14;--ink:#F7F0EA;--cherry:#E0364F;--soft:#4a1426;--card:#3D1220;--line:#5C1A2A;--leaf:#5fd07f;--muted:#D9A3AD}.foot{text-align:center;margin-top:28px;font-size:.85rem}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:20px 18px 48px}
h1{font-size:2.3rem;line-height:1;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:1.3rem;margin:0 0 4px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.route{display:block;width:240px;max-width:70%;margin:8px auto 4px}
.route .trail{fill:none;stroke:var(--cherry);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s ease-out .2s forwards}
.route .dot{fill:var(--ink)}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.route .trail{animation:none;stroke-dashoffset:0}}
.stats{display:flex;gap:10px;margin:14px 0 20px}
.stats div{flex:1;background:var(--soft);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:1.25rem}
#intro[hidden]{display:none}form{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px}
label{display:block;font-weight:600;font-size:.95rem;margin:0 0 6px}
.field{margin-bottom:14px}
input,select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--cherry);outline-offset:2px}
.pace{display:flex;align-items:center;gap:8px}
.pace input{text-align:center;font-size:1.6rem;font-weight:800;padding:10px}
.pace span{font-weight:800;font-size:1.6rem}
.pace small{white-space:nowrap}
.btn{font:inherit;font-weight:800;font-size:1.05rem;border:0;border-radius:999px;background:var(--cherry);color:#fff;padding:14px 22px;width:100%;cursor:pointer}
.btn[hidden]{display:none}.runner .tempo{display:block;text-align:right;margin:0 0 6px}.btn.ghost{background:transparent;color:var(--cherry);border:2px solid var(--cherry);padding:9px 16px;width:auto;font-size:.95rem}
.btn.ghost[disabled]{color:var(--leaf);border-color:var(--leaf);cursor:default}
.err{color:var(--cherry);font-weight:600;min-height:1.3em;margin:8px 0 0;font-size:.9rem}
#result{display:none}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:6px 0 14px}
.top button{background:none;border:0;color:var(--cherry);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:6px}
.chips{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.chip{font:inherit;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cherry);border-color:var(--cherry);color:#fff}
.runner{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--cherry);font-size:1.1rem}
.runner .info{flex:1;min-width:0}
.runner b{display:block}
.runner small{display:block;color:var(--muted)}
.tag{display:inline-block;font-size:.8rem;font-weight:600;color:var(--leaf);margin-top:2px}
.pacebig{font-weight:800;font-size:1.15rem;text-align:right;flex:none}
.pacebig small{font-weight:400}
.empty{background:var(--soft);border-radius:16px;padding:18px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.shot{margin:6px auto 14px;max-width:360px;border-radius:22px;overflow:hidden;border:1.5px solid var(--line);box-shadow:0 14px 34px rgba(200,16,46,.28);animation:reveal 1.6s cubic-bezier(.2,.7,.2,1) .15s both}.shot img{display:block;width:100%;height:auto}@keyframes reveal{from{clip-path:circle(0% at 50% 62%);transform:scale(.94)}to{clip-path:circle(75% at 50% 62%);transform:scale(1)}}@media (prefers-reduced-motion:reduce){.shot{animation:none}}.mcard{text-align:center;padding:26px 0}.spin{width:44px;height:44px;border:4px solid var(--soft);border-top-color:var(--cherry);border-radius:50%;margin:40px auto 14px;animation:giro .9s linear infinite}@keyframes giro{to{transform:rotate(360deg)}}.check{width:76px;height:76px;border-radius:50%;background:var(--cherry);color:#fff;font-size:2.4rem;font-weight:800;display:grid;place-items:center;margin:0 auto 14px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}.duo{display:flex;gap:10px;margin:18px 0}.pc{flex:1;min-width:0;background:var(--soft);border-radius:18px;padding:10px;text-align:center}.pc .thumb{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 58%;border-radius:12px;margin-bottom:8px;border:1.5px solid var(--line)}.pc .nome{display:block;font-weight:800;font-size:.98rem;line-height:1.2;margin-bottom:4px}.pc .tmp{display:block;font-weight:800;font-size:1.5rem;line-height:1.2}.pc small{display:block}.igpill{display:inline-block;margin-top:8px;background:var(--cherry);color:#fff;font-weight:600;font-size:.85rem;padding:5px 10px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#tEle{animation:reveal 1.3s cubic-bezier(.2,.7,.2,1) 1.2s both}@media (prefers-reduced-motion:reduce){#tEle{animation:none}}.chat{text-align:left;margin:0 0 20px}.bub{max-width:86%;padding:10px 14px;border-radius:18px;margin-bottom:8px}.bub.eu{background:var(--cherry);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.bub.ele{background:var(--card);border:1.5px solid var(--line);border-bottom-left-radius:4px}@media (prefers-reduced-motion:reduce){.check{animation:none}}.shot{position:relative}.shot.noanim,.shot.noanim #cap{animation:none}#cap{position:absolute;left:0;right:0;top:0;padding:14px 16px 46px;background:linear-gradient(rgba(36,16,21,.94),rgba(36,16,21,.6) 62%,transparent);color:#F7F0EA;animation:subir .8s ease .9s both}#cap[hidden]{display:none}.capnome{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.capnome b{font-size:1.5rem;font-weight:800;line-height:1.1}.capnome .mini{width:26px;height:26px}.capnome span{flex-basis:100%;font-size:.9rem;color:#F3C2CA}.capstats{display:flex;gap:18px;margin-top:8px}.capstats small{display:block;font-size:.72rem;color:#F3C2CA}.capstats b{font-size:1.1rem}
.fadein{animation:subir .5s ease both}@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.rv{opacity:0;animation:subir .6s ease forwards}
.hero{position:relative;width:160px;height:150px;margin:0 auto 6px;display:grid;place-items:center}.glow{position:absolute;inset:10px 14px;border-radius:50%;background:radial-gradient(circle,rgba(240,98,122,.6),transparent 68%);animation:pulso 2s ease-in-out infinite}@keyframes pulso{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.15);opacity:1}}.bigcherry{position:relative;width:112px;height:112px;animation:pop .7s cubic-bezier(.2,1.5,.4,1) both,balanca 3s ease-in-out 1s infinite}@keyframes balanca{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.spark{position:absolute;width:24px;height:24px;animation:brilho 1.8s ease-in-out infinite}.s1{top:6px;left:14px;color:#F0627A}.s2{top:20px;right:8px;width:16px;height:16px;color:var(--cherry);animation-delay:.5s}.s3{bottom:16px;left:4px;width:14px;height:14px;color:var(--cherry);animation-delay:1s}.s4{bottom:6px;right:18px;color:#F0627A;animation-delay:.3s}@keyframes brilho{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.brilha{font-size:2rem;line-height:1.1;margin:4px 0 8px;background:linear-gradient(100deg,var(--cherry) 30%,#F0627A 50%,var(--cherry) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:varre 2.4s linear infinite}@keyframes varre{from{background-position:120% 0}to{background-position:-120% 0}}
.loadcherry{display:block;width:72px;height:72px;margin:54px auto 12px;animation:pulso2 .9s ease-in-out infinite}@keyframes pulso2{0%,100%{transform:scale(.9)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.rv,.fadein,#cap{animation:none;opacity:1}.bigcherry,.glow,.loadcherry,.brilha{animation:none}.brilha{color:var(--cherry);background:none}.spark{animation:none;opacity:1}}</style>
</head>

  <p class="foot muted">Cherry Coke · Cherry Moods</p>
</main>
<div id="toast" role="status"></div>

<script>
var NH=["Rafael","Bruno","Thiago","Lucas","Pedro","Gabriel","Felipe","Gustavo","Guilherme","Leonardo","Eduardo","Rodrigo","Matheus","André","Marcelo","Daniel","Vinícius","Henrique","Diego","Fábio","Ricardo","Caio","João","Arthur","Leandro","Renato","Alexandre","Fernando","Victor","Igor","Otávio","Murilo","Raul","Davi","Samuel","Tiago","Marcos","Sérgio","Paulo","Carlos","Fabrício","Wagner","Roberto","Júlio","Danilo","Cauã"];
var NM=["Fernanda","Mariana","Beatriz","Juliana","Camila","Isabela","Larissa","Amanda","Carolina","Letícia","Patrícia","Vitória","Luciana","Daniela","Priscila","Renata","Natália","Aline","Bianca","Gabriela","Paula","Tatiana","Rafaela","Bruna","Luiza","Clara","Marina","Débora","Vanessa","Elisa","Flávia","Helena","Sofia","Carla","Raquel","Cláudia","Thaís","Manuela","Lívia","Alice"];
var SN=["Correia","Lima","Mendes","Souza","Alves","Prado","Reis","Nunes","Ferraz","Costa","Silva","Santos","Oliveira","Pereira","Rodrigues","Almeida","Nascimento","Carvalho","Gomes","Martins","Araújo","Ribeiro","Barbosa","Cardoso","Rocha","Dias","Teixeira","Moreira","Cavalcanti","Freitas","Monteiro","Moura","Campos","Machado","Duarte","Azevedo","Vieira","Batista","Pinto","Barros","Medeiros","Fonseca","Siqueira","Tavares","Guimarães","Lopes","Melo","Andrade","Ramos","Borges","Peixoto","Coelho","Amaral","Brandão","Sampaio","Bastos","Cunha","Paiva","Valente","Figueiredo","Nogueira","Lacerda","Viana","Franco","Bittencourt","Salgado","Queiroz","Pacheco","Xavier","Miranda"];
var NICK={Fernanda:"fê",Rafael:"rafa",Gabriel:"gabs",Gabriela:"gabi",Bruno:"bru",Thiago:"thi",Leonardo:"leo",Eduardo:"edu",Guilherme:"gui",Gustavo:"gus",Felipe:"lipe",Mariana:"mari",Beatriz:"bia",Juliana:"ju",Camila:"cami",Isabela:"isa",Larissa:"lari",Amanda:"manda",Carolina:"carol",Letícia:"lê",Patrícia:"pat",Vitória:"vivi",Luciana:"lu",Daniela:"dani",Priscila:"pri",Renata:"re",Natália:"nat",Aline:"ali",Rodrigo:"digo",Matheus:"math",Marcelo:"celo",Vinícius:"vini",Henrique:"rique",Alexandre:"alê",Fernando:"nando",Victor:"vic",Bianca:"bi",Rafaela:"rafa",Bruna:"bru",Luiza:"lu",Marina:"mari",Débora:"deb",Vanessa:"van",Flávia:"fla",Raquel:"quel",Thaís:"thai",Manuela:"manu",Lívia:"livi",Tatiana:"tati"};
var HORAS=["Sáb 6h","Sáb 6h30","Sáb 7h","Sáb 8h","Dom 6h30","Dom 7h","Dom 7h30","Ter e qui 6h","Seg, qua e sex 6h","Qua 19h"];
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var R=rng(2026);
function pick(a){return a[Math.floor(R()*a.length)]}
function gauss(){var u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function slug(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]/g,"")}
function gerar(){
  var out=[],nomes={},igs={};
  for(var i=0;i<504;i++){
    var homem=i<302,pn=pick(homem?NH:NM),sob=pick(SN),nome=pn+" "+sob,t=0;
    while(nomes[nome]&&t++<30){sob=pick(SN);nome=pn+" "+sob}
    nomes[nome]=1;
    var f=slug(pn),l=slug(sob),n=slug(NICK[pn]||pn.slice(0,4));
    var pats=[f+"."+l,f+l,n+"."+l,f+"_"+l,n+l,f+"."+l+(10+Math.floor(R()*89)),n+"_"+l,n+"."+l+".run",l+"."+f.charAt(0)+"run"];
    var ig=pick(pats);
    while(igs[ig]){ig=ig+Math.floor(R()*99)}
    igs[ig]=1;
    var rapido=i<106||(i>=302&&i<347),pace;
    if(rapido){pace=225+Math.round(74*Math.pow(R(),homem?0.9:0.6))}
    else{pace=Math.round((homem?365:400)+gauss()*(homem?45:55));if(pace<300)pace=600-pace;pace=Math.min(570,pace)}
    out.push({id:i,nome:nome,ig:ig,pace:pace,tempo:Math.round(pace*5.26),quando:pick(HORAS)});
  }
  return out;
}
var corredores=gerar(),meuPace=0,meuNome="",atual=null,margem=2,limite=10,convidados={},$=function(i){return document.getElementById(i)};
function fmt(s){var m=Math.floor(s/60),r=s%60;return m+":"+(r<10?"0":"")+r}
function encontrarParceiros(pace,lista,m){
  return lista.filter(function(c){return Math.abs(c.pace-pace)<=m})
    .sort(function(a,b){return Math.abs(a.pace-pace)-Math.abs(b.pace-pace)});
}
function fade(el){el.classList.remove("fadein");void el.offsetWidth;el.classList.add("fadein")}
function toast(t){var e=$("toast");e.textContent=t;e.className="on";clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=""},2800)}
function render(){
  var achados=encontrarParceiros(meuPace,corredores,margem),l=$("lista"),mais=$("mais");
  $("titulo").textContent=achados.length?achados.length+(achados.length>1?" parceiros no seu ritmo":" parceiro no seu ritmo"):"Ninguém por perto ainda";
  $("sub").textContent="Seu pace: "+fmt(meuPace)+" min/km"+(achados.length?" · mostrando "+Math.min(limite,achados.length)+" de "+achados.length:"");
  mais.hidden=achados.length<=limite;
  if(!achados.length){l.innerHTML='<div class="empty"><b>Nenhum corredor nessa faixa.</b><p class="muted">Aumente a diferença de pace aceita.</p></div>';return}
  l.innerHTML=achados.slice(0,limite).map(function(c){
    var d=c.pace-meuPace,ad=Math.abs(d);
    var tag=ad<=1?"Mesmo ritmo que o seu":(d<0?ad+" s/km mais rápido":ad+" s/km mais lento");
    var ok=convidados[c.id];
    return '<div class="runner"><div class="avatar" aria-hidden="true">'+c.nome.charAt(0)+'</div>'+
    '<div class="info"><b>'+c.nome+'</b><small>'+c.quando+'</small><span class="tag">'+tag+'</span></div>'+
    '<div><div class="pacebig">'+fmt(c.pace)+'<small> /km</small></div><small class="muted tempo">Tempo '+fmt(c.tempo)+'</small>'+
    '<button class="btn ghost" data-i="'+c.id+'"'+(ok?' disabled>Convite aceito ✓':'>Correr junto')+'</button></div></div>';
  }).join("");
}
$("form").addEventListener("submit",function(e){
  e.preventDefault();
  var m=parseInt($("min").value,10),s=parseInt($("seg").value,10)||0,nome=$("nome").value.trim();
  if(!nome){$("err").textContent="Digite seu nome para continuar.";return}
  if(isNaN(m)||m<3||m>12||s<0||s>59){$("err").textContent="Informe um pace entre 3:00 e 12:59 min/km.";return}
  $("err").textContent="";
  meuPace=m*60+s;meuNome=nome;limite=10;
  var ig=$("contato").value.trim().replace(/^@/,"");
  $("capNome").textContent=nome;$("capIg").textContent=ig?"@"+ig:"";
  $("capTempo").textContent=fmt(Math.round(meuPace*5.26));$("capPace").textContent=fmt(meuPace)+" /km";$("cap").hidden=false;
  $("intro").hidden=false;$("form").style.display="none";$("result").style.display="block";
  render();fade($("result"));window.scrollTo({top:0,behavior:"smooth"});
  toast("Cadastro feito, "+nome+"!");
});
$("editar").onclick=function(){$("cap").hidden=true;$("intro").hidden=true;$("result").style.display="none";$("form").style.display="block";window.scrollTo({top:0})};
document.querySelector(".chips").addEventListener("click",function(e){
  var b=e.target.closest(".chip");if(!b)return;
  margem=parseInt(b.dataset.m,10);document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",c===b?"true":"false")});
  limite=10;render();
});
$("mais").onclick=function(){limite+=10;render()};
$("lista").addEventListener("click",function(e){
  var b=e.target.closest("button[data-i]");if(!b)return;
  abrirMatch(corredores[b.dataset.i]);
});
var ABRE=["Oi, {n}! Vi que a gente corre no mesmo pace. Bora correr juntos?","E aí, {n}! Nosso ritmo é quase igual. Topa um treino juntos?","Oi, {n}! Que tal a gente correr junto qualquer dia desses?","{n}, achei você pelo pace! Bora treinar juntos?","Fala, {n}! Meu pace bate com o seu. Vamos correr juntos?"];
var RESP=["Bora! Aceito o convite 🍒 Me chama no Instagram: @{ig}","Que massa, a gente tem o mesmo ritmo! Me manda um oi no Insta: @{ig}","Aceitei! Costumo correr {quando}, combina com você? Me chama: @{ig}","Já tava procurando alguém no meu pace 😄 Fala comigo no @{ig}","Topo demais! Me segue no @{ig} e a gente combina o próximo treino","Show, {voce}! Corro {quando}. Vamos marcar? @{ig}","Até que enfim alguém no meu ritmo! Me chama no Insta, é @{ig}","Fechou! Vamos fazer um treino juntos 🍒 Meu Insta: @{ig}","Perfeito, correr acompanhado é bem melhor! Me chama no @{ig}","Aceito! Esse pace é o meu favorito. Chama no Insta: @{ig}","Boa! Bora marcar um café depois do treino 🍒 @{ig}","Sim! Me avisa o dia e eu apareço. Meu Insta é @{ig}"];
function texto(a,s,v){var x=a[s%a.length];for(var k in v)x=x.split("{"+k+"}").join(v[k]);return x}
function abrirMatch(c){
  atual=c;convidados[c.id]=true;
  $("shot").hidden=true;$("intro").hidden=true;$("result").style.display="none";
  $("match").hidden=false;fade($("match"));$("mload").hidden=false;$("mok").hidden=true;
  $("mloadNome").textContent=c.nome.split(" ")[0];window.scrollTo(0,0);
  clearTimeout(abrirMatch.t);

    var pn=c.nome.split(" ")[0];
    $("msub").textContent=pn+" aceitou seu convite. Vocês vão correr juntos: "+c.quando+".";
    var src=$("shot").querySelector("img").src;$("tEu").src=src;$("tEle").src=src;
    $("mEuNome").textContent=meuNome;$("mDeleNome").textContent=c.nome;
    $("mMeuT").textContent=fmt(Math.round(meuPace*5.26));$("mDeleT").textContent=fmt(c.tempo);
    $("mMeu").textContent=fmt(meuPace);$("mDele").textContent=fmt(c.pace);$("mIg").textContent="@"+c.ig;
    $("chatEu").textContent=texto(ABRE,c.id*3,{n:pn});
    $("chatEle").textContent=texto(RESP,c.id*7,{n:pn,voce:meuNome.split(" ")[0],quando:c.quando,ig:c.ig});
    $("mload").hidden=true;$("mok").hidden=false;
  },1100);
}
$("mvoltar").onclick=function(){$("match").hidden=true;$("shot").classList.add("noanim");$("shot").hidden=false;$("intro").hidden=false;$("result").style.display="block";fade($("result"));render();window.scrollTo(0,0)};

</script>
